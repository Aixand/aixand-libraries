name: Library checks and publishing

on:
  push:
    branches: [main]
    tags: ['release-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    name: Select libraries and validate tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
      requirements: ${{ steps.packages.outputs.requirements }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/tests -v
      - id: packages
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 scripts/release.py select

  test:
    name: Test (${{ matrix.package }}, ${{ matrix.os }}, Python ${{ matrix.python }})
    needs: select
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select.outputs.packages) }}
        os: [ubuntu-24.04, macos-15, windows-2022]
        python: ['3.11', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: '0.12.7'
          python-version: ${{ matrix.python }}
      - name: Prepare locked environment with local dependencies
        shell: bash
        run: python "$PACKAGE/dev.py" develop --local
      - name: Check and test
        shell: bash
        run: |
          python "$PACKAGE/dev.py" check
          python "$PACKAGE/dev.py" test

  build:
    name: Verify distributions (${{ matrix.package }})
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select.outputs.packages) }}
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: '0.12.7'
          python-version: '3.11'
      - name: Build clean wheel and source distribution
        run: python "$PACKAGE/dev.py" build --python 3.11 --output "$PWD/dist/$PACKAGE"
      - name: Check metadata and README
        run: uvx --from twine==7.0.0 twine check --strict "dist/$PACKAGE/"*
      - name: Prepare dependency wheel
        if: matrix.package == 'local-runtime'
        run: python filesystem/dev.py build --python 3.11 --output "$PWD/dist/dependencies"
      - name: Test wheel and rebuilt source distribution
        run: |
          if [ "$PACKAGE" = 'local-runtime' ]; then
            python scripts/release.py smoke "$PACKAGE" "dist/$PACKAGE" --wheelhouse dist/dependencies
          else
            python scripts/release.py smoke "$PACKAGE" "dist/$PACKAGE"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions-${{ matrix.package }}
          path: dist/${{ matrix.package }}/*
          if-no-files-found: error

  publish:
    name: Publish all libraries to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release-')
    needs: [select, test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: distributions-*
          path: dist/
      - name: Publish filesystem
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/distributions-filesystem/
          skip-existing: true
      - name: Publish GitHub source
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/distributions-github-source/
          skip-existing: true
      - name: Publish local runtime
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/distributions-local-runtime/
          skip-existing: true

  verify-published:
    name: Verify all published libraries from PyPI
    needs: [select, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: '0.12.7'
          python-version: '3.11'
      - name: Install each package at its declared version from PyPI
        env:
          RELEASE_REQUIREMENTS: ${{ needs.select.outputs.requirements }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import subprocess
          import time

          requirements = json.loads(os.environ["RELEASE_REQUIREMENTS"])
          environment = Path(os.environ["RUNNER_TEMP"]) / "published"
          subprocess.run(["uv", "venv", str(environment)], check=True)
          python = str(environment / "bin/python")
          for attempt in range(12):
              result = subprocess.run([
                  "uv", "pip", "install", "--refresh",
                  "--index-url", "https://pypi.org/simple",
                  "--python", python, *requirements,
              ])
              if result.returncode == 0:
                  break
              if attempt == 11:
                  raise SystemExit(result.returncode)
              time.sleep(10)
          subprocess.run([python, "-I", "-c",
              "import aixand_filesystem, aixand_local_runtime, github_source"], check=True)
          subprocess.run(["uv", "pip", "check", "--python", python], check=True)
          PYTHON
